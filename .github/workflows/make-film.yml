name: Make a film
run-name: Film — ${{ inputs.title }}
on:
  workflow_call:
    inputs:
      title:
        required: true
        type: string
      brief:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      title:
        description: Film title (up to 120 characters)
        required: true
        type: string
      brief:
        description: Story, setting, mood and ending. 3–4 minute story. Say she/he to select the lead.
        required: true
        type: string
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FILM_TITLE: ${{ inputs.title }}
      FILM_BRIEF: ${{ inputs.brief }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      CMAKE_ARGS: '-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DLLAMA_CURL=OFF'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ai.txt
      - name: Identify this story for resumable writing
        id: story_cache
        run: |
          python - <<'PYCODE'
          import hashlib, json, os
          data = ['directed-v6', os.environ['FILM_TITLE'], os.environ['FILM_BRIEF'], 'Qwen3-4B-Instruct-2507']
          digest = hashlib.sha256(json.dumps(data).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=story-v60-' + digest + '\n')
          PYCODE
      - name: Restore story writing progress
        uses: actions/cache/restore@v4
        with:
          path: output/ai-response.checkpoint.json
          key: ${{ steps.story_cache.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.story_cache.outputs.key }}-
      - name: Reuse local story weights
        if: "${{ !contains(inputs.brief, 'authored depression story') && !contains(inputs.brief, 'sample: depressed') }}"
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: qwen3-4b-instruct-2507-q4km-v1
      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core build-essential cmake
      - name: Install local speech tools
        run: python -m pip install -r requirements.txt
      - name: Install general story writer
        if: "${{ !contains(inputs.brief, 'authored depression story') && !contains(inputs.brief, 'sample: depressed') }}"
        run: python -m pip install -r requirements-ai.txt
      - name: Test renderer and input handling
        run: python -m unittest discover -s tests -v
      - name: Write shots, animate and render
        run: python -m storyfilm.render --fps 12 --height 1080 --out output
      - name: Preserve verified story progress for a retry
        if: "${{ always() && hashFiles('output/ai-response.checkpoint.json') != '' }}"
        uses: actions/cache/save@v4
        with:
          path: output/ai-response.checkpoint.json
          key: ${{ steps.story_cache.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify finished MP4
        run: python -m storyfilm.verify output/film.mp4 --height 1080 --fps 12 --min-seconds 180 --max-seconds 240
      - name: Upload finished film and editable story
        uses: actions/upload-artifact@v4
        with:
          name: film-${{ github.run_number }}
          path: |
            output/film.mp4
            output/story.json
            output/screenplay.md
            output/timeline.json
            output/frames.jsonl
            output/storyboard.jpg
            output/characters.png
            output/captions.srt
            output/narration.wav
            output/report.json
          retention-days: 7
          if-no-files-found: error
      - name: Save diagnostics if rendering fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: film-diagnostics-${{ github.run_number }}
          path: |
            output/story.json
            output/storyboard.jpg
            output/report.json
            output/ai-response.txt
            output/ai-response.checkpoint.json
          if-no-files-found: ignore
          retention-days: 3
