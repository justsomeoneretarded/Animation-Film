name: Make a film
run-name: Film — ${{ inputs.title }}
on:
  workflow_call:
    inputs:
      title:
        required: true
        type: string
      brief:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      title:
        description: Film title (up to 120 characters)
        required: true
        type: string
      brief:
        description: Story, setting, mood and ending. 3–4 minute story. Say she/he to select the lead.
        required: true
        type: string
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FILM_TITLE: ${{ inputs.title }}
      FILM_BRIEF: ${{ inputs.brief }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      CMAKE_ARGS: '-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DLLAMA_CURL=OFF'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ai.txt
      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core build-essential cmake
      - name: Install local speech tools
        run: python -m pip install -r requirements.txt
      - name: Install general story writer
        if: ${{ !contains(inputs.brief, 'authored depression story') && !contains(inputs.brief, 'sample: depressed') }}
        run: python -m pip install -r requirements-ai.txt
      - name: Test renderer and input handling
        run: python -m unittest discover -s tests -v
      - name: Plan, animate, narrate and render
        run: python -m storyfilm.render --fps 12 --height 1080 --out output
      - name: Verify finished MP4
        run: python -m storyfilm.verify output/film.mp4 --height 1080 --fps 12 --min-seconds 180 --max-seconds 240
      - name: Upload finished film and editable story
        uses: actions/upload-artifact@v4
        with:
          name: film-${{ github.run_number }}
          path: |
            output/film.mp4
            output/story.json
            output/storyboard.jpg
            output/characters.png
            output/captions.srt
            output/narration.wav
            output/report.json
          retention-days: 7
          if-no-files-found: error
      - name: Save diagnostics if rendering fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: film-diagnostics-${{ github.run_number }}
          path: |
            output/story.json
            output/storyboard.jpg
            output/report.json
            output/ai-response.txt
          if-no-files-found: ignore
          retention-days: 3
