name: Full AI film acceptance
# Validate official GGUF inference, spoken narration and full 1080p rendering.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/acceptance.yml
permissions:
  contents: read
jobs:
  example:
    uses: ./.github/workflows/make-film.yml
    with:
      title: Depressed
      brief: Use the authored depression story. Male lead. A difficult night, an unfinished list, a short walk, a quiet park bench, and the decision to ask for support. A beginning rather than an instant recovery.
