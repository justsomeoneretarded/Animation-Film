name: General writer acceptance
# Validate a complete 36-shot action story and sparse story direction for a female lead.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/general-acceptance.yml
permissions:
  contents: read
jobs:
  general:
    uses: ./.github/workflows/make-film.yml
    with:
      title: The Unfinished Page
      brief: Female lead. She avoids answering a difficult message in her bedroom. She tries to write the truth in a notebook at her desk but stops. She takes a walk outside, then sits on a park bench. She returns to the message and sends a short honest answer instead of a perfect one. End at the same desk, writing again. Quiet and specific, with no instant transformation.
